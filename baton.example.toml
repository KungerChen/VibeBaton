# VibeBaton Configuration (Zero-dependency native TOML)
# Edit any provider or role model below — changes hot-reload before the next dispatched task.

[daemon]
db_path = ".baton/state.sqlite"
worktree_root = ".baton/worktrees"
base_branch = "main"
dev_branch = "dev"
prevent_sleep_windows = true
default_stall_timeout_sec = 300
default_hard_timeout_sec = 1800
poll_interval_sec = 1.0

[policies]
machine_gate_before_ai_review = true
max_self_heal_attempts = 2
max_review_rejects = 2
require_human_approval_at = ["rfc_signoff", "plan_amendment", "final_merge"]

# [notifications]
# enabled = true
# desktop_toast = true  # Windows desktop sessions
# terminal_bell = true  # Interactive terminals
# webhook_url = ""  # Optional direct override, e.g. https://alerts.example.invalid/webhook/placeholder
# webhook_url_env = ""  # Set to "BATON_WEBHOOK_URL" for environment or local credential lookup.
# webhook_format = "auto"  # auto, generic, slack, discord, feishu, wecom, dingtalk
# webhook_timeout_sec = 5.0
# on_waiting_human = true
# on_ready_for_final_gate = true
# on_failed = true
# on_paused = true
# on_long_cooldown_sec = 300  # Set to 0 to disable cooldown alerts.

# ---------------------------------------------------------------------------
# Providers (CLI command templates + subscription quota cooldown policies)
# Placeholders available in `command`: {model}, {workdir}, {prompt_file}, {output_file}
# ---------------------------------------------------------------------------

[providers.claude_sub]
type = "cli"
max_concurrency = 1
cooldown_backoff_sec = [300, 900, 1800]
rate_limit_regex = "(rate.?limit|usage.?limit|429|try again|overloaded|credit balance)"
command = ["claude", "-p", "--model", "{model_name}", "--effort", "{effort}", "--dangerously-skip-permissions", "--output-format", "json"]
prompt_via = "stdin"
stall_timeout_sec = 900
hard_timeout_sec = 2400

[providers.codex_sub]
type = "cli"
max_concurrency = 1
cooldown_backoff_sec = [300, 900, 1800]
rate_limit_regex = "(rate.?limit|usage.?limit|429|too many requests|quota)"
command = ["codex", "exec", "--json", "--model", "{model_name}", "-c", "model_reasoning_effort=\"{effort}\"", "-s", "workspace-write", "-c", "approval_policy=\"never\"", "-o", "{output_file}", "-"]
prompt_via = "stdin"
stall_timeout_sec = 900
hard_timeout_sec = 2400

[providers.dsh_opencode]
type = "cli"
max_concurrency = 4
cooldown_backoff_sec = [30, 120, 300]
rate_limit_regex = "(rate.?limit|429|quota|temporarily unavailable|overloaded)"
# DeepSeek Harness (dsh) headless mode calling your configured OpenCode Go API profile.
# Uses a zero-secret patch overlay under `{package_root}/presets/` to enable credentials + opencode-go.
command = ["dsh", "--profile", "headless", "--json", "--patch", "{package_root}/presets/dsh-headless-opencode-go.patch.yml", "--permission-mode", "workspace-write", "--approval-policy", "never", "-"]
prompt_via = "stdin"
stall_timeout_sec = 240
hard_timeout_sec = 1200

# To use this OpenAI-compatible provider, set OPENAI_API_KEY, uncomment the
# example, and set a role's provider to "openai_http" and model to "gpt-4o-mini".
# [providers.openai_http]
# type = "http"
# base_url = "https://api.openai.com/v1"
# api_key_env = "OPENAI_API_KEY"
#
# Example prices in USD per million tokens. Use the rates for your endpoint.
# [providers.openai_http.model_pricing."gpt-4o-mini"]
# input_per_1m = 0.15
# output_per_1m = 0.60
# cached_input_per_1m = 0.075

# ---------------------------------------------------------------------------
# Logical Roles (Swap any model in 1 line; swap provider in 2 lines)
# ---------------------------------------------------------------------------

[roles.brainstorm_and_final_gate]
provider = "host_native"
model = "gemini-4-neon-high"
prompt_file = "prompts/l0_final_gate.md"

[roles.tactical_planner]
provider = "claude_sub"
model = "fable@high"
prompt_file = "prompts/l1_planner.md"

[roles.milestone_reviewer]
provider = "claude_sub"
model = "opus@high"
prompt_file = "prompts/l1_milestone_reviewer.md"
fallback = [{ provider = "codex_sub", model = "gpt-6.2-astra@xhigh" }]

[roles.micro_orchestrator]
provider = "codex_sub"
model = "gpt-6.2-astra@xhigh"
prompt_file = "prompts/l2_codex_orchestrator.md"

[roles.critical_executor]
provider = "codex_sub"
model = "gpt-6.2-sol@max"
prompt_file = "prompts/l2_codex_specialist.md"

[roles.bulk_worker]
provider = "dsh_opencode"
model = "deepseek-v4.1-flash@max"
prompt_file = "prompts/l3_dsh_worker.md"
fallback = [{ provider = "codex_sub", model = "gpt-6.2-sol@max" }]

# ---------------------------------------------------------------------------
# Pricing (optional; the values shown are the defaults)
# Rates are USD per million tokens. Custom overrides take precedence over
# fetched official rates. Set VIBEBATON_DISABLE_PRICING_SYNC=1 to disable the
# background rate refresh.
# ---------------------------------------------------------------------------

# [pricing]
# auto_sync = true  # Refresh the official rate feed in the background.
# refresh_interval_hours = 24  # Skip a refresh until the cache is this old.
# source_url = "https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json"
# timeout_sec = 5.0  # HTTP timeout for one rate refresh, in seconds.
# cache_path = ""  # Empty uses ~/.vibebaton/pricing_cache.json.
# custom_path = ""  # Empty uses ~/.vibebaton/custom_pricing.json.
#
# Override fetched or built-in rates for one model:
# [pricing.custom."deepseek-v4-pro"]
# input_per_1m = 1.32
# output_per_1m = 3.96
# cached_input_per_1m = 0.044
