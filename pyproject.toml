[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibebaton"
version = "0.1.0"
description = "Node-based multi-agent coding workflow orchestrator with Git worktree isolation, mechanical gates, and subscription-aware scheduling."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "VibeBaton Contributors" }]
keywords = ["ai", "agents", "vibe-coding", "orchestrator", "mcp", "claude", "codex", "opencode", "git-worktree"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.0"]

[project.scripts]
baton = "vibebaton.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
